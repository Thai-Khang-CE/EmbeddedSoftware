name: C/C++ CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Install ARM GCC Toolchain & Make
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi make gcc

    - name: Build for Host Platform
      run: |
        echo "Building for HOST..."
        make build PLATFORM=HOST

    - name: Build for MSP432 Platform
      run: |
        echo "Building for MSP432..."
        make build PLATFORM=MSP432

    - name: Check Output Linker & ELF
      run: |
        ls -la *.out || true
        ls -la *.map || true